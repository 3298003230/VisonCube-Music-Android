  Release:
    name: Release
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-latest
    # needs: [Android, Android_SL]
    needs: [Android]
    steps:
      - name: Check out git repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Generate file MD5
        run: |
          echo -e '\n### File MD5\n```' >> ./publish/changeLog.md
          cd artifacts
          md5sum *.apk >> ../publish/changeLog.md
          echo -e '```\n' >> ../publish/changeLog.md
          echo -e '\n[VisonCube Music Android Releases](https://github.com/3298003230/VisonCube-Music-Android/releases)\n' >> ../publish/changeLog.md

      - name: Get package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: ./publish/changeLog.md
          prerelease: false
          draft: false
          tag_name: v${{ env.PACKAGE_VERSION }}
          files: |
            artifacts/VisonCube-Music-v${{ env.PACKAGE_VERSION }}-arm64-v8a.apk
            artifacts/VisonCube-Music-v${{ env.PACKAGE_VERSION }}-armeabi-v7a.apk
            artifacts/VisonCube-Music-v${{ env.PACKAGE_VERSION }}-x86_64.apk
            artifacts/VisonCube-Music-v${{ env.PACKAGE_VERSION }}-x86.apk
            artifacts/VisonCube-Music-v${{ env.PACKAGE_VERSION }}-universal.apk

          # artifacts/lx-music-mobile-v${{ env.PACKAGE_VERSION }}-sl-arm64-v8a.apk
          # artifacts/lx-music-mobile-v${{ env.PACKAGE_VERSION }}-android_5-universal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
